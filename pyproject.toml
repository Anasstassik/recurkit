[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "recurkit"
version = "0.1.0"
description = "RFC 5545 recurrence rules engine written from scratch on the Python standard library"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.scripts]
recurkit = "recurkit.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "python-dateutil>=2.9",
    "types-python-dateutil>=2.9",
    "tzdata>=2024.1",
    "ruff>=0.6",
    "mypy>=1.11",
    "pygount>=1.8",
    "import-linter>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["recurkit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "RecurKit never reads the clock: pass the moment as a parameter."
"datetime.datetime.utcnow".msg = "RecurKit never reads the clock: pass the moment as a parameter."
"datetime.datetime.today".msg = "RecurKit never reads the clock: pass the moment as a parameter."
"datetime.date.today".msg = "RecurKit never reads the clock: pass the moment as a parameter."

[tool.importlinter]
root_package = "recurkit"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core layers: ical -> recurrence_set -> expand -> rule -> calendar_math"
type = "layers"
layers = [
    "recurkit.ical",
    "recurkit.recurrence_set",
    "recurkit.expand",
    "recurkit.rule",
    "recurkit.calendar_math",
]

[[tool.importlinter.contracts]]
name = "Rule expansion works in local time only"
type = "forbidden"
source_modules = ["recurkit.expand", "recurkit.rule", "recurkit.calendar_math"]
forbidden_modules = ["recurkit.timezones", "recurkit.recurrence_set", "zoneinfo"]

[[tool.importlinter.contracts]]
name = "Only the ZoneInfo adapter touches the zoneinfo module"
type = "forbidden"
source_modules = [
    "recurkit.ical",
    "recurkit.recurrence_set",
    "recurkit.timezones.provider",
    "recurkit.timezones.fake",
    "recurkit.timezones.posix",
]
forbidden_modules = ["zoneinfo"]
allow_indirect_imports = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --import-mode=importlib"
markers = ["perf: cost checks (memory, expanded periods) rather than behaviour"]

[tool.coverage.run]
branch = true
source = ["recurkit"]
omit = ["recurkit/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
