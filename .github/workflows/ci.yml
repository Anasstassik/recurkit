name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy recurkit

      - name: Import layers
        run: lint-imports

      - name: Pytest with branch coverage
        run: pytest -q --cov --cov-report=term

      - name: CLI smoke test
        run: recurkit expand tests/data/ics/team.ics --from 2026-01-01 --to 2026-03-31 --tz Europe/Kyiv